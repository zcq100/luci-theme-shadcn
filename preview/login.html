<!DOCTYPE html>
<html lang="zh-Hans" data-darkmode="false">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>shadcn theme preview | Login</title>
	<link rel="stylesheet" href="../htdocs/luci-static/shadcn/cascade.css">
</head>
<body>
<div class="shadcn-login">
	<main class="shadcn-login-card">
		<div class="shadcn-login-brand">
			<img src="../htdocs/luci-static/shadcn/logo.svg" alt="" width="48" height="48">
			<h1>Authorization Required</h1>
			<p>Please enter your username and password.</p>
		</div>

		<form method="post" class="shadcn-login-form">
			<label class="shadcn-field" for="luci_username">
				<span>Username</span>
				<input name="luci_username" id="luci_username" type="text" autocomplete="username" value="root">
			</label>

			<label class="shadcn-field" for="luci_password">
				<span>Password</span>
				<input name="luci_password" id="luci_password" type="password" autocomplete="current-password">
			</label>

			<button type="submit" class="btn cbi-button cbi-button-apply important">Log in</button>
		</form>
	</main>

	<div class="shadcn-login-footer">LuCI openwrt-24.10 · OpenWrt 24.10.0</div>
</div>

<script>
	if (location.hash === '#dark')
		document.documentElement.setAttribute('data-darkmode', 'true');
</script>
</body>
</html>
